<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LV @ NYJ · Simulated game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b16;--panel:#0e1528;--panel2:#131c34;--line:#233052;--text:#e9eef8;--muted:#8e9bb9;--dim:#5b6888;
  --gold:#ffd23f;--los:#59a8ff;--good:#3ddc97;--bad:#ff5d6e;--flag:#ffcf1a;--turf:#2e6a3b;--turf2:#2a6236;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:13px/1.35 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit}
.app{max-width:1260px;margin:0 auto;padding:16px}
.cond{font-family:"Barlow Condensed",Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}

/* scoreboard */
.board{display:grid;grid-template-columns:1fr minmax(150px,auto) 1fr;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.tm{display:flex;align-items:center;gap:12px;padding:10px 18px;min-height:74px}
.tm.home{flex-direction:row-reverse;text-align:right}
.tm .meta{flex:1;min-width:0}
.tm .name{font:700 22px/1 "Barlow Condensed",Inter,sans-serif;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm .sub{color:rgba(255,255,255,.72);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-top:4px;display:flex;gap:8px;align-items:center}
.tm.home .sub{justify-content:flex-end}
.pos{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);visibility:hidden}
.tm.has .pos{visibility:visible}
.score{font:800 52px/1 "Barlow Condensed",Inter,sans-serif;min-width:64px;text-align:center;transition:transform .25s}
.score.pop{animation:pop .9s ease}
@keyframes pop{0%{transform:scale(1)}25%{transform:scale(1.35);color:var(--gold)}100%{transform:scale(1)}}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 18px;background:#0a1020;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.clock{font:700 28px/1 "Barlow Condensed",Inter,sans-serif;letter-spacing:.03em}
.dd{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-top:6px;white-space:nowrap}

/* win probability */
.wp{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:12px;margin:10px 2px 0}
.wp .pct{font:800 24px/1 "Barlow Condensed",Inter,sans-serif;font-style:italic}
.wp .pct.r{text-align:right}
.wpbar{position:relative;height:10px;border-radius:6px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.wpbar .a,.wpbar .h{position:absolute;top:0;bottom:0;transition:width .5s ease}
.wpbar .a{left:0}.wpbar .h{right:0}
.wpbar .mid50{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:rgba(255,255,255,.55)}
.wplabel{text-align:center;color:var(--dim);font-size:10px;letter-spacing:.18em;text-transform:uppercase;margin-top:4px}

/* layout */
.grid{display:grid;grid-template-columns:250px minmax(0,1fr) 250px;gap:14px;margin-top:14px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}
@media (max-width:1040px){.grid{grid-template-columns:1fr 1fr}.center{grid-column:1 / -1;order:-1}}
@media (max-width:620px){.grid{grid-template-columns:1fr}.board{grid-template-columns:1fr auto 1fr}.tm{padding:8px 10px;gap:6px}.tm .name{font-size:16px}.score{font-size:36px;min-width:40px}.mid{padding:6px 8px}.clock{font-size:20px}.tm .sub{display:none}}

/* box scores */
.box{padding:12px 12px 8px;font-size:12px}
.box h2{margin:0;font:700 17px/1 "Barlow Condensed",Inter,sans-serif;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.box h2 i{width:4px;height:16px;border-radius:2px;display:inline-block}
.box .tot{color:var(--muted);font-size:11px;margin:6px 0 4px}
.box table{width:100%;border-collapse:collapse;margin-top:8px}
.box th{color:var(--dim);font-weight:600;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;text-align:right;padding:2px 0 3px 4px}
.box th:first-child{text-align:left}
.box td{padding:3px 0 3px 4px;text-align:right;font-variant-numeric:tabular-nums;border-top:1px solid rgba(255,255,255,.04)}
.box td:first-child{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:118px}
.box td .p{color:var(--dim);font-size:10px;margin-left:4px}
.box tr.zero td{color:var(--dim)}
.box tr.hot td{background:rgba(255,210,63,.12);color:#fff}
.box tr.hot td:first-child{box-shadow:inset 3px 0 0 var(--gold)}

/* field */
.center{display:flex;flex-direction:column;gap:12px;min-width:0}
.fieldwrap{position:relative;padding:10px;border-radius:12px;background:linear-gradient(#0d1a12,#08120c);border:1px solid var(--line)}
svg{display:block;width:100%;height:auto}
.banner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .25s}
.banner.show{opacity:1}
.banner span{font:800 clamp(28px,6vw,64px)/1 "Barlow Condensed",Inter,sans-serif;font-style:italic;letter-spacing:.04em;text-transform:uppercase;padding:8px 28px;border-radius:8px;background:rgba(7,11,22,.82);border:2px solid var(--gold);color:var(--gold);text-shadow:0 0 18px rgba(255,210,63,.5)}

.ticker{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:58px}
.chip{flex:none;font:800 15px/1 "Barlow Condensed",Inter,sans-serif;font-style:italic;text-transform:uppercase;letter-spacing:.03em;padding:7px 10px;border-radius:6px;color:#fff;white-space:nowrap}
.chip small{font:600 10px/1 Inter,sans-serif;font-style:normal;letter-spacing:.06em;opacity:.85;margin-left:6px}
.tick{flex:1;min-width:0}
.tick .sit{color:var(--muted);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.tick .txt{font-weight:600;font-size:14px;margin-top:3px}
.tag{flex:none;font:800 12px/1 "Barlow Condensed",Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
.tag.score{background:var(--gold);border-color:var(--gold);color:#111}
.tag.turnover{background:var(--bad);border-color:var(--bad);color:#fff}
.tag.penalty{background:var(--flag);border-color:var(--flag);color:#111}
.tag.miss{border-color:var(--bad);color:var(--bad)}

.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;font-weight:600;min-width:38px}
.btn:hover{border-color:#3a4a75}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#111;min-width:84px}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--los);outline-offset:2px}
.speeds{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.speeds button{background:transparent;border:0;border-right:1px solid var(--line);padding:7px 9px;cursor:pointer;color:var(--muted);font-weight:600}
.speeds button:last-child{border-right:0}
.speeds button.on{background:var(--panel2);color:var(--text)}
.scrub{flex:1;min-width:140px;accent-color:var(--gold)}
.count{color:var(--muted);font-size:11px;min-width:64px;text-align:right}

.charts{padding:12px 14px 8px}
.charts h3,.scoring h3{margin:0 0 6px;color:var(--muted);font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.scoring{padding:12px 14px}
.scoring ol{list-style:none;margin:0;padding:0;max-height:180px;overflow:auto}
.scoring li{display:grid;grid-template-columns:58px 40px 1fr 92px;gap:8px;padding:6px 0;border-top:1px solid rgba(255,255,255,.05);align-items:baseline}
.scoring li:first-child{border-top:0}
.scoring .q{color:var(--dim);font-size:11px}
.scoring .t{font-weight:700}
.scoring .s{text-align:right;font-weight:700}
.empty{color:var(--dim);font-size:12px;padding:4px 0}
footer{color:var(--dim);font-size:11px;text-align:right;margin-top:12px}
@media (prefers-reduced-motion:reduce){.score.pop{animation:none}.wpbar .a,.wpbar .h{transition:none}}
</style>
</head>

for(const dx of [-4,0,4]) el('line',{x1:dx,x2:dx,y1:-3,y2:3,stroke:'#fff','stroke-width':1.5},ballG);
let ballX = 50, anim = null;
function placeBall(x){ballX=x;ballG.setAttribute('transform',`translate(${X(x)} 280)`)}
function moveBall(from, to, ms){
  if(anim) cancelAnimationFrame(anim);
  if(ms<=0||reduce){placeBall(to);return}
  const t0=performance.now();
  const step=now=>{const k=Math.min(1,(now-t0)/ms),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;placeBall(from+(to-from)*e);if(k<1)anim=requestAnimationFrame(step)};
  anim=requestAnimationFrame(step);
}
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- chart ----------
const C = $('chart');
function cel(tag, attrs){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);C.appendChild(e);return e}

function drawChart(i){
  C.textContent='';
  const end = Math.max(60, ...E.map(e=>e.t)), L=36, R=736, wpTop=8, wpH=62, scTop=96, scH=128;
  const tx = t => L + (R-L)*t/end;
  const shown = E.slice(0, i+1);
  const maxPts = Math.max(21, ...shown.map(e=>Math.max(e.h,e.a)));
  const top = Math.ceil((maxPts+4)/7)*7;
  const ty = p => scTop + scH - scH*p/top;
  const wy = w => wpTop + wpH*(1-w);
  for(let q=0;q<=end;q+=15){ cel('line',{x1:tx(q),x2:tx(q),y1:wpTop,y2:scTop+scH,stroke:'#233052','stroke-width':1});
    if(q<end){ const t=cel('text',{x:tx(q+7.5),y:scTop+scH+16,'text-anchor':'middle',fill:'#5b6888','font-size':11}); t.textContent=q>=60?'OT':'Q'+(q/15+1);} }
  cel('line',{x1:L,x2:R,y1:wy(.5),y2:wy(.5),stroke:'#3a4870','stroke-dasharray':'3 4'});
  for(let p=0;p<=top;p+=7){ cel('line',{x1:L,x2:R,y1:ty(p),y2:ty(p),stroke:'#1a2440'}); const t=cel('text',{x:L-8,y:ty(p)+4,'text-anchor':'end',fill:'#5b6888','font-size':11}); t.textContent=p; }
  const lab=(x,y,s,c,a)=>{const t=cel('text',{x,y,'text-anchor':a||'start',fill:c,'font-size':11,'font-weight':700});t.textContent=s};
  lab(L-8,wy(1)+9,H,COL[H],'end'); lab(L-8,wy(0),A,COL[A],'end');
  // win probability: home above the midline, away below
  let wp=[[0,D.simulated]]; for(const e of shown) wp.push([e.t,e.wp]);
  const path=wp.map(([t,w],k)=>(k?'L':'M')+tx(t).toFixed(1)+' '+wy(w).toFixed(1)).join(' ');
  const last=wp[wp.length-1];
  const area=(clipTop,clipH,color)=>{const id='c'+Math.random().toString(36).slice(2);const cp=cel('clipPath',{id});const r=document.createElementNS(NS,'rect');r.setAttribute('x',0);r.setAttribute('y',clipTop);r.setAttribute('width',800);r.setAttribute('height',clipH);cp.appendChild(r);
    cel('path',{d:path+` L${tx(last[0]).toFixed(1)} ${wy(.5)} L${tx(0)} ${wy(.5)} Z`,fill:color,opacity:.28,'clip-path':`url(#${id})`});};
  area(0,wy(.5),COL[H]); area(wy(.5),200,COL[A]);
  cel('path',{d:path,fill:'none',stroke:'#e9eef8','stroke-width':1.6});
  // score worm: step lines
  for(const [t,key] of [[A,'a'],[H,'h']]){
    let d=`M${tx(0)} ${ty(0)}`, prev=0;
    for(const e of shown){ if(e[key]!==prev){ d+=` L${tx(e.t).toFixed(1)} ${ty(prev).toFixed(1)} L${tx(e.t).toFixed(1)} ${ty(e[key]).toFixed(1)}`; prev=e[key]; } }
    const tEnd = shown.length?shown[shown.length-1].t:0;
    d+=` L${tx(tEnd).toFixed(1)} ${ty(prev).toFixed(1)}`;
    cel('path',{d,fill:'none',stroke:COL[t],'stroke-width':3,'stroke-linejoin':'round'});
    for(const e of shown){ const k = shown.indexOf(e); const before = k?shown[k-1][key]:0; if(e[key]!==before) cel('circle',{cx:tx(e.t),cy:ty(e[key]),r:3.5,fill:COL[t],stroke:'#0e1528','stroke-width':1.5}); }
    lab(tx(tEnd)+8, ty(prev)+4 + (t===H && shown.length && shown[shown.length-1].h===shown[shown.length-1].a ? -10 : 0), `${t} ${prev}`, COL[t]);
  }
}

// ---------- box scores ----------
const zero = () => new Float64Array(D.stats.length);
function accumulate(i){
  const acc={[H]:{},[A]:{}};
  for(let k=0;k<=i;k++) for(const [t,pid,s,v] of E[k].d){ (acc[t][pid] ||= zero())[s]+=v; }
  return acc;
}
const pname = pid => (D.players[pid]||[pid])[0];
const ppos = pid => (D.players[pid]||['',''])[1]||'';
function boxHTML(t, acc, hot){
  const rows=acc[t], st=D.starters[t], g=pid=>rows[pid]||zero();
  const uniq=a=>[...new Set(a)];
  const has=(k)=>Object.keys(rows).filter(p=>rows[p][SI[k]]>0);
  const r = (pid, cells) => {const z=cells.every(c=>c==='0'||c===0||c==='0/0'||c==='0-0');
    return `<tr class="${hot.has(pid)?'hot':''} ${z?'zero':''}"><td title="${pname(pid)}">${pname(pid)}<span class="p">${ppos(pid)}</span></td>${cells.map(c=>`<td>${c}</td>`).join('')}</tr>`};
  const table=(title,cols,body)=>body.length?`<table><thead><tr><th>${title}</th>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${body.join('')}</tbody></table>`:'';
  const byYds=(list,k)=>list.sort((a,b)=>g(b)[SI[k]]-g(a)[SI[k]]);
  const passers=uniq([st.qb,...has('pass_att'),...has('sacked')]);
  const rushers=byYds(uniq([...st.carries,...has('rush_car')]),'rush_yds');
  const recv=byYds(uniq([...st.targets,...has('tgt')]),'rec_yds');
  const defs=uniq([...has('def_sack'),...has('def_int')]);
  const i=k=>Math.round(g(k)); const v=(p,k)=>Math.round(g(p)[SI[k]]);
  let yds=0,to=0; for(const p in rows){yds+=rows[p][SI.pass_yds]-rows[p][SI.sack_yds]+rows[p][SI.rush_yds];to+=rows[p][SI.pass_int]+rows[p][SI.fum_lost]}
  $('tot-'+(t===H?'home':'away')).textContent=`${Math.round(yds)} yds · ${to} TO`;
  return `<h2><i style="background:${COL[t]}"></i>${D.teams[t].name}</h2><div class="tot">${Math.round(yds)} total yards · ${to} turnover${to===1?'':'s'}</div>`+
    table('Passing',['C/Att','Yds','TD','Int'],passers.map(p=>r(p,[`${v(p,'pass_cmp')}/${v(p,'pass_att')}`,v(p,'pass_yds'),v(p,'pass_td'),v(p,'pass_int')])))+
    table('Rushing',['Car','Yds','TD'],rushers.map(p=>r(p,[v(p,'rush_car'),v(p,'rush_yds'),v(p,'rush_td')])))+
    table('Receiving',['Rec','Yds','TD','Tgt'],recv.map(p=>r(p,[v(p,'rec'),v(p,'rec_yds'),v(p,'rec_td'),v(p,'tgt')])))+
    table('Kicking',['FG','XP'],[st.kicker].map(p=>r(p,[`${v(p,'fgm')}/${v(p,'fga')}`,`${v(p,'xpm')}/${v(p,'xpa')}`])))+
    table('Defense',['Sk','Int'],defs.map(p=>r(p,[v(p,'def_sack'),v(p,'def_int')])));
}

// ---------- rendering ----------
const ord=n=>['','1st','2nd','3rd','4th'][n]||'';
function spot(team, y){ y=Math.round(y); if(y===50)return '50'; return y<50?`${team===H?A:H} ${y}`:`${team} ${100-y}`; }
function clockAfter(t){
  const e=Math.round(t*60);
  if(e>=3600){const r=Math.max(0,4200-e);return `OT ${Math.floor(r/60)}:${String(r%60).padStart(2,'0')}`}
  let q=Math.min(4,Math.floor(e/900)+1), r=q*900-e;
  if(e>0&&e%900===0){q=e/900;r=0}
  return `Q${q} ${Math.floor(r/60)}:${String(r%60).padStart(2,'0')}`;
}
function scorer(k){ const p=k?E[k-1]:{h:0,a:0}; return E[k].h>p.h?H:A; }
function situationText(e){ return e.down? `${ord(e.down)} & ${e.togo>=e.y?'Goal':e.togo} · ${spot(e.pos,e.y)}` : 'Kickoff'; }
function tagLabel(e){
  if(e.tag==='score') return /SAFETY/.test(e.text)?'Safety':/TOUCHDOWN/.test(e.text)?'Touchdown':'Field goal';
  return {turnover:'Turnover',penalty:'Flag',miss:'No good',kick:/punt/i.test(e.text)?'Punt':'Kickoff'}[e.tag]||'';
}
let shownScore={h:0,a:0};
function render(i, animate){
  const e = i>=0?E[i]:null, next = E[i+1];
  const h=e?e.h:0, a=e?e.a:0;
  for(const [key,id,val] of [['h','score-home',h],['a','score-away',a]]){
    const s=$(id); s.textContent=val; if(animate && val!==shownScore[key]){s.classList.remove('pop');void s.offsetWidth;s.classList.add('pop')} }
  shownScore={h,a};
  const done = i===N-1;
  $('clock').textContent = !e?'Q1 15:00': done?(E[N-1].t>60?'FINAL / OT':'FINAL'):clockAfter(e.t);
  $('dd').textContent = done? (h===a?'Tie game':`${h>a?D.teams[H].name:D.teams[A].name} win`) : next?situationText(next):'';
  const posTeam = next?next.pos:(e?e.pos1:null);
  $('tm-home').classList.toggle('has', !done && posTeam===H && !!next && next.down>0);
  $('tm-away').classList.toggle('has', !done && posTeam===A && !!next && next.down>0);
  const wp = e?e.wp:D.simulated;
  $('wph').style.width=(wp*100)+'%'; $('wpa').style.width=((1-wp)*100)+'%';
  $('wp-home').textContent=Math.round(wp*100)+'%'; $('wp-away').textContent=Math.round((1-wp)*100)+'%';
  $('wp-home').style.color=COL[H]; $('wp-away').style.color=COL[A];
  // ticker
  if(e){ const c=fill(e.pos); $('chip').style.background=c; $('chip').innerHTML=`${e.pos} ${e.down?'ball':''}<small>${e.q} ${Math.floor(e.clock/60)}:${String(e.clock%60).padStart(2,'0')}</small>`;
    $('sit').textContent=situationText(e)+(e.look?` · vs ${e.look}`:''); $('txt').textContent=e.text;
    const tl=tagLabel(e); $('tag').hidden=!tl; $('tag').textContent=tl; $('tag').className='tag '+(e.tag||''); }
  else { $('chip').style.background='#233052'; $('chip').textContent='Pregame'; $('sit').textContent=`${D.teams[A].name} at ${D.teams[H].name}`; $('txt').textContent='Press play to start the simulated game.'; $('tag').hidden=true; }
  // field markers for the next snap
  const from = e?e.x0:50, to = e?e.x1:(next?next.x0:50);
  moveBall(animate?from:to, to, animate?Math.min(650, delay()*.55):0);
  const nx = next && next.down>0 ? next : null;
  los.setAttribute('x1',X(nx?nx.x0:to)); los.setAttribute('x2',X(nx?nx.x0:to)); los.setAttribute('opacity',nx?.95:0);
  fd.setAttribute('opacity', nx&&nx.fd!==null?.95:0); if(nx&&nx.fd!==null){fd.setAttribute('x1',X(nx.fd));fd.setAttribute('x2',X(nx.fd));}
  const holder = nx?nx.pos:(e?e.pos1:H);
  tagRect.setAttribute('fill', fill(holder)); tagRect.setAttribute('stroke', COL[holder]); tagText.textContent=holder;
  // drive band from the first snap of the current drive
  let k=i+1, start=null; if(nx){ while(k>0 && E[k-1].pos===nx.pos && E[k-1].down>0) k--; start=E[k].x0; }
  if(start!==null){ const x1=X(Math.min(start,nx.x0)), x2=X(Math.max(start,nx.x0)); drive.setAttribute('x',x1); drive.setAttribute('width',Math.max(0,x2-x1)); drive.setAttribute('fill',COL[nx.pos]); }
  else drive.setAttribute('width',0);
  // boxes, chart, scoring
  const acc=accumulate(i), hot=new Set(e?e.d.map(x=>x[1]):[]);
  $('box-home').innerHTML=boxHTML(H,acc,hot); $('box-away').innerHTML=boxHTML(A,acc,hot);
  drawChart(i);
  const sc=E.slice(0,i+1).map((x,k)=>[x,k]).filter(([x])=>x.tag==='score').reverse();
  $('scoring').innerHTML = sc.length? sc.map(([x,k])=>{const t=scorer(k);return `<li><span class="q">${x.q} ${Math.floor(x.clock/60)}:${String(x.clock%60).padStart(2,'0')}</span><span class="t" style="color:${COL[t]}">${t}</span><span>${x.text}</span><span class="s cond">${A} ${x.a}–${x.h} ${H}</span></li>`}).join('') : '<li class="empty">No scoring yet</li>';
  if(animate && e && e.tag==='score'){ const b=$('banner'), t=scorer(i); $('banner-text').textContent=`${tagLabel(e)} ${D.teams[t].name}`;
    $('banner-text').style.borderColor=COL[t]; $('banner-text').style.color=COL[t]; b.classList.add('show'); setTimeout(()=>b.classList.remove('show'), Math.max(700,delay()*1.6)); }
  $('scrub').value=i+1; $('count').textContent=`${i+1} / ${N}`;
}

// ---------- playback ----------
const SPEEDS=[1,2,4,8,16]; let speed=2, idx=-1, timer=null;
function delay(){ return 1100/speed; }
for(const s of SPEEDS){ const b=document.createElement('button'); b.textContent=s+'×'; b.className=s===speed?'on':''; b.onclick=()=>{speed=s;[...$('speeds').children].forEach(c=>c.classList.toggle('on',c===b))}; $('speeds').appendChild(b); }
function stop(){ clearTimeout(timer); timer=null; $('play').textContent= idx>=N-1?'↺ Replay':'▶ Play'; }
function tick(){
  if(idx>=N-1) return stop();
  idx++; render(idx,true);
  const e=E[idx]; const hold = e.tag==='score'?2.4:e.tag==='turnover'?1.6:1;
  timer=setTimeout(tick, delay()*hold);
}
$('play').onclick=()=>{ if(timer) return stop(); if(idx>=N-1){idx=-1;render(-1,false)} $('play').textContent='❚❚ Pause'; tick(); };
$('restart').onclick=()=>{ stop(); idx=-1; render(-1,false); };
$('end').onclick=()=>{ stop(); idx=N-1; render(idx,false); stop(); };
$('scrub').oninput=ev=>{ stop(); idx=+ev.target.value-1; render(idx,false); };
document.addEventListener('keydown',ev=>{ if(ev.code==='Space'&&ev.target.tagName!=='INPUT'){ev.preventDefault();$('play').click()} });
render(-1,false);
if(D.autoplay && !reduce) setTimeout(()=>{ if(!timer && idx<0) $('play').click(); }, 900);
})();
</script>
</body>
</html>
